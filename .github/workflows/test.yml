name: Test

on:
  pull_request:

jobs:
  libs-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.3.1577

      - name: Run tests
        run: clojure -X:test
